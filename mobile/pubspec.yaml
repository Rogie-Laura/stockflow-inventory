publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  flutter_dotenv: ^6.0.1
  provider: ^6.1.5+1
  intl: ^0.20.2
  http: ^1.5.0
  mobile_scanner: ^7.0.1
  unity_ads_plugin: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
